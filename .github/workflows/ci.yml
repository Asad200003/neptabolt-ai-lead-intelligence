name: Neptabolt AI Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/api/requirements.txt

    - name: Run Basic Health & Schema Imports Check
      run: |
        python -c "from apps.api.app.main import app; print('FastAPI App Imported Successfully')"